
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Account | Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="minecraft-member">

    <!-- nav, minecraft style -->

    <header class="minecraft-navbar">
        <nav class="minecraft-nav-links" aria-label="Main navigation">

            <a href="/">
                <img src="/images/home_button.png" alt="Home">
            </a>

            <a href="/catalogue">
                <img src="/images/catalogue_button.png" alt="Catalogue">
            </a>

            <a href="/members">
                <img src="/images/members_button.png" alt="Members">
            </a>

            <a href="#admin-login">
                <img src="/images/admin_button.png" alt="Admin">
            </a>

        </nav>
    </header>

    <!-- members only. -->

    <main class="member-account">

        <a href="/members" class="back-link">
            &larr; Back to Members
        </a>

        <!-- their profile, maybe add a display picture for each, maybe not. -->

        <section class="account-header">

            <div class="member-avatar" id="member-avatar">--</div>

            <div class="account-identity">
                <p class="account-label">MEMBER ACCOUNT</p>
                <h1 id="member-name">Loading member...</h1>
                <p id="member-id"></p>
            </div>

        </section>

        <!-- members stats. -->

        <div class="account-stats">

            <div class="stat-card">
                <p>Books on Loan</p>
                <h2 id="loan-count">0</h2>
            </div>

            <div class="stat-card">
                <p>Reservations</p>
                <h2 id="reservation-count">0</h2>
            </div>

        </div>

        <!-- borrowed books -->

        <section class="account-section">

            <div class="section-heading">
                <h2>Currently Borrowed</h2>

                <a href="/catalogue" class="button-link">
                    Browse Books
                </a>
            </div>

            <div id="member-loans" class="account-list">
                <p>Loan information is not available yet.</p>
            </div>

        </section>

        <!-- reserved books -->

        <section class="account-section">

            <div class="section-heading">
                <h2>Reservations</h2>
            </div>

            <div id="member-reservations" class="account-list">
                <p>Reservation information is not available yet.</p>
            </div>

        </section>

    </main>

    <!-- admin login -->

    <div id="admin-login" class="modal">

        <div class="login-box">

            <a href="#" class="close" aria-label="Close">&times;</a>

            <h2>Admin Login</h2>

            <form action="/admin">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <footer class="account-footer minecraft-footer">
        <p>&copy; 2026 Red Bricks Library</p>
    </footer>

    <script>

        async function loadMember() {

            // reads member ID from URL: /member?id=2
            const params = new URLSearchParams(window.location.search);
            const memberId = Number(params.get("id"));

            const nameElement = document.getElementById("member-name");
            const idElement = document.getElementById("member-id");
            const avatarElement = document.getElementById("member-avatar");

            // validates the member ID
            if (!Number.isSafeInteger(memberId) || memberId <= 0) {
                nameElement.textContent = "Invalid member ID";
                return;
            }

            try {

                // request member data from ApiController
                const response = await fetch("/api/members");

                if (!response.ok) {
                    throw new Error("Unable to retrieve members");
                }

                // convert JSON response into JavaScript objects
                const members = await response.json();

                // finds the member matching the URL ID
                const member = members.find(
                    m => Number(m.id) === memberId
                );

                if (!member) {
                    nameElement.textContent = "Member not found";
                    return;
                }

                // shows the members name
                nameElement.textContent =
                    member.firstName + " " + member.lastName;

                // displays there membership number
                idElement.textContent = "Member #" + member.id;

                // uses the first char of there name as a avatar
                avatarElement.textContent =
                    member.firstName.charAt(0).toUpperCase() +
                    member.lastName.charAt(0).toUpperCase();

                // update
                document.title =
                    member.firstName + " " + member.lastName +
                    " | Red Bricks Library";

            } catch (error) {

                console.error("Member loading error:", error);

                nameElement.textContent = "Unable to load member";
                idElement.textContent = "";
                avatarElement.textContent = "--";
            }
        }

        // runs when the page loads
        loadMember();

    </script>

</body>
</html>
