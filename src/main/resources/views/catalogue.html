
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue | Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="minecraft-catalogue">

    <!-- nav -->

    <header class="minecraft-navbar">
        <nav class="minecraft-nav-links" aria-label="Main navigation">

            <a href="/">
                <img src="/images/home_button.png" alt="Home">
            </a>

            <a href="/catalogue" aria-current="page">
                <img src="/images/catalogue_button.png" alt="Catalogue">
            </a>

            <a href="/members">
                <img src="/images/members_button.png" alt="Members">
            </a>

            <a href="#admin-login">
                <img src="/images/admin_button.png" alt="Admin">
            </a>

        </nav>
    </header>

    <main class="minecraft-content">

        <!-- search bar -->

        <section class="minecraft-panel">

            <h1>Library Catalogue</h1>

            <p>
                Search the Red Bricks Library collection
                by title, author or ISBN.
            </p>

            <form class="search-form" id="catalogue-search">

                <input
                    type="text"
                    id="book-search"
                    name="search"
                    placeholder="Title, author or ISBN"
                >

                <button type="submit">Search</button>

            </form>

        </section>

        <!-- books retrieved from Java -->

        <section class="minecraft-panel">

            <h2>Library Collection</h2>

            <div class="book-grid" id="book-grid">
                <p>Loading books...</p>
            </div>

        </section>

    </main>

    <!-- admin popup -->

    <div id="admin-login" class="modal">

        <div class="login-box">

            <a href="#" class="close" aria-label="Close">&times;</a>

            <h2>Admin Login</h2>

            <form action="/admin">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <footer class="minecraft-footer">
        <p>Red Bricks Library</p>
    </footer>

    <script>

        // gets the books from java
        let allBooks = [];

        // loads them.
        async function loadBooks() {

            const bookGrid = document.getElementById("book-grid");

            try {

                const response = await fetch("/api/catalogue");

                if (!response.ok) {
                    throw new Error("Unable to retrieve book");
                }

                const book = await response.json();

                allBooks = book ? [book] : [];

                displayBooks(allBooks);

            } catch (error) {

                bookGrid.textContent = "Unable to load books.";

                console.error("Catalogue loading error:", error);
            }
        }

        // displays the books
        function displayBooks(books) {

            const bookGrid = document.getElementById("book-grid");

            bookGrid.replaceChildren();

            if (books.length === 0) {

                const message = document.createElement("p");
                message.textContent = "No books found.";

                bookGrid.appendChild(message);
                return;
            }

            books.forEach(book => {

                // creates a book card for each, hopefully.
                const card = document.createElement("div");
                card.className = "book-card";

                // book information - title
                const title = document.createElement("h3");
                title.textContent = book.title;

                // book info - author
                const author = document.createElement("p");
                author.textContent = book.author;

                // more book info
                const isbn = document.createElement("p");
                const isbnLabel = document.createElement("strong");
                isbnLabel.textContent = "ISBN: ";

                isbn.appendChild(isbnLabel);
                isbn.appendChild(document.createTextNode(book.isbn));

                // what type is it
                const media = document.createElement("p");
                const mediaLabel = document.createElement("strong");
                mediaLabel.textContent = "Format: ";

                media.appendChild(mediaLabel);
                media.appendChild(document.createTextNode(book.mediaType));

                // what catagory does it belong in
                const category = document.createElement("p");
                const categoryLabel = document.createElement("strong");
                categoryLabel.textContent = "Category: ";

                category.appendChild(categoryLabel);
                category.appendChild(document.createTextNode(book.catagory));

                // lets create the books.
                card.appendChild(title);
                card.appendChild(author);
                card.appendChild(isbn);
                card.appendChild(media);
                card.appendChild(category);

                // the add the card to the grid.
                bookGrid.appendChild(card);

            });
        }

        // a nifty little search bar
        document.getElementById("catalogue-search")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const search = document
                    .getElementById("book-search")
                    .value
                    .trim()
                    .toLowerCase();

                const filteredBooks = allBooks.filter(book => {

                    return (
                        book.title.toLowerCase().includes(search) ||
                        book.author.toLowerCase().includes(search) ||
                        book.isbn.toLowerCase().includes(search)
                    );

                });

                displayBooks(filteredBooks);

            });

        // load all the books when the page opens.
        loadBooks();

    </script>

</body>
</html>
