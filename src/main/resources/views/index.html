<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <nav class="navbar">
        <a href="/index" class="logo">RED BRICKS LIBRARY</a>

        <div class="nav-links">
            <a href="/catalogue">Catalogue</a>
            <a href="/members">Members</a>
            <a href="#admin-login">Admin</a>
        </div>
    </nav>

    <main>

        <section class="hero">
            <h1>Welcome to Red Bricks Library</h1>
            <p>Search our collection, manage your books and discover your next read.</p>

            <a href="catalogue.html" class="button-link">Browse Library</a>
        </section>

    </main>


    <!-- ADMIN LOGIN POPUP -->

    <div id="admin-login" class="modal">

        <div class="login-box">

            <a href="#" class="close">&times;</a>

            <h2>Admin Login</h2>

            <form action="/admin">

                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" required>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <footer>
        <p>Red Bricks Library</p>
    </footer>

</body>

</html>
