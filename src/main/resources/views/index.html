
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="minecraft-home">


<header class="minecraft-navbar">
    <nav class="minecraft-nav-links" aria-label="Main navigation">

        <a href="/catalogue">
            <img src="/images/catalogue_button.png" alt="Catalogue">
        </a>

        <a href="/members">
            <img src="/images/members_button.png" alt="Members">
        </a>

        <a href="#admin-login">
            <img src="/images/admin_button.png" alt="Admin">
        </a>

    </nav>
</header>


    <main class="minecraft-main">
        <a href="/catalogue" class="browse-books">
            <img src="/images/browsebooks_button.png" alt="Browse Books">
        </a>
    </main>

    <!-- Admin Login Popup -->
    <div id="admin-login" class="modal">
        <div class="login-box">
            <a href="#" class="close" aria-label="Close">&times;</a>

            <h2>Admin Login</h2>

            <form action="/admin">
                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
