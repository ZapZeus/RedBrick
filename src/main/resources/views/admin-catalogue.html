
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Catalogue | Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="minecraft-admin-catalogue">

    <!-- admin navv -->

<header class="minecraft-navbar admin-navbar">
    <nav class="admin-nav-links" aria-label="Admin navigation">

        <a href="/admin">
            <img src="/images/admin_button.png" alt="Dashboard">
        </a>

        <a href="/admin/catalogue">
            <img src="/images/catalogue_button.png" alt="Catalogue">
        </a>

        <a href="/admin/members">
            <img src="/images/members_button.png" alt="Members">
        </a>

        <a href="/admin/loans">
            <img src="/images/loans_button.png" alt="Loans">
        </a>

        <a href="/admin/reservations">
            <img src="/images/reservation_button.png" alt="Reservations">
        </a>

        <a href="/" class="logout-button">
            <img src="/images/logout.png" alt="Logout">
        </a>

    </nav>
</header>


    <main class="minecraft-content">

        <!-- search bar -->

        <section class="minecraft-panel">

            <h1>Catalogue Management</h1>

            <p>
                Search, add, edit or remove library inventory.
            </p>

            <form class="search-form">

                <input
                    type="text"
                    name="search"
                    placeholder="Title, author or ISBN"
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>

        <!-- inventory-->

        <section class="minecraft-panel">

            <div class="section-heading">

                <h2>Inventory</h2>

                <button type="button">
                    Add Item
                </button>

            </div>

            <div class="member-list">

                <!-- book 1 -->

                <div class="member-row">

                    <div>
                        <strong>The Silent Forest</strong>
                        <p>Emily Carter | Physical | Available</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>

                <!-- book 2 -->

                <div class="member-row">

                    <div>
                        <strong>Rails of Destiny</strong>
                        <p>Mark Holloway | eBook | Borrowed</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>

                <!-- book 3 -->

                <div class="member-row">

                    <div>
                        <strong>Quantum Dreams</strong>
                        <p>Sarah Linwood | Physical | Available</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="minecraft-footer">
        <p>Red Bricks Library Administration</p>
    </footer>

</body>
</html>
