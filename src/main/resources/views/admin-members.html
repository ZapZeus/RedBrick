
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Members | Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="minecraft-admin-members">

    <!-- nav -->

<header class="minecraft-navbar admin-navbar">
    <nav class="admin-nav-links" aria-label="Admin navigation">

        <a href="/admin">
            <img src="/images/admin_button.png" alt="Dashboard">
        </a>

        <a href="/admin/catalogue">
            <img src="/images/catalogue_button.png" alt="Catalogue">
        </a>

        <a href="/admin/members">
            <img src="/images/members_button.png" alt="Members">
        </a>

        <a href="/admin/loans">
            <img src="/images/loans_button.png" alt="Loans">
        </a>

        <a href="/admin/reservations">
            <img src="/images/reservation_button.png" alt="Reservations">
        </a>

        <a href="/" class="logout-button">
            <img src="/images/logout.png" alt="Logout">
        </a>

    </nav>
</header>


    <main class="minecraft-content">

        <!-- search bar -->

        <section class="minecraft-panel">

            <h1>Member Management</h1>

            <p>
                Search, add, edit or remove library members.
            </p>

            <form class="search-form">

                <input
                    type="text"
                    name="search"
                    placeholder="Search members"
                >

                <button type="submit">Search</button>

            </form>

        </section>

        <!-- members bit -->

        <section class="minecraft-panel">

            <div class="section-heading">

                <h2>Members</h2>

                <button type="button">
                    Add Member
                </button>

            </div>

            <div class="member-list">

                <!-- temp bit here -->

                <div class="member-row">

                    <div>
                        <strong>Tony Stark</strong>
                        <p>tony.stark@avengers.com</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>


                <div class="member-row">

                    <div>
                        <strong>Peter Parker</strong>
                        <p>peter.parker@avengers.com</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>


                <div class="member-row">

                    <div>
                        <strong>Steve Rogers</strong>
                        <p>steve.rogers@avengers.com</p>
                    </div>

                    <div class="actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="minecraft-footer">
        <p>Red Bricks Library Administration</p>
    </footer>

</body>
</html>
