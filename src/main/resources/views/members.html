
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | Red Bricks Library</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="minecraft-members">

    <!-- nav -->

    <header class="minecraft-navbar">
        <nav class="minecraft-nav-links" aria-label="Main navigation">

            <a href="/">
                <img src="/images/home_button.png" alt="Home">
            </a>

            <a href="/catalogue">
                <img src="/images/catalogue_button.png" alt="Catalogue">
            </a>

            <a href="/members" aria-current="page">
                <img src="/images/members_button.png" alt="Members">
            </a>

            <a href="#admin-login">
                <img src="/images/admin_button.png" alt="Admin">
            </a>

        </nav>
    </header>

    <!-- members -->

    <main class="minecraft-content">

        <section class="minecraft-panel">

            <h1>Find a Member</h1>

            <p>
                Find your library account to view your loans
                and reservations.
            </p>

            <form class="search-form" id="search-form">

                <input
                    type="text"
                    id="member-search"
                    name="search"
                    placeholder="Search member name"
                >

                <button type="submit">Search</button>

            </form>

        </section>

        <section class="minecraft-panel">

            <h2>Library Members</h2>

            <div class="member-list" id="member-list">
                <p>Loading members...</p>
            </div>

        </section>

    </main>


    <div id="admin-login" class="modal">

        <div class="login-box">

            <a href="#" class="close" aria-label="Close">&times;</a>

            <h2>Admin Login</h2>

            <form action="/admin">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <footer class="minecraft-footer">
        <p>Red Bricks Library</p>
    </footer>

    <script>

        // Store members retrieved from Java
        let allMembers = [];

        // Load members from the Java API
        async function loadMembers() {

            const memberList = document.getElementById("member-list");

            try {

                const response = await fetch("/api/members");

                if (!response.ok) {
                    throw new Error("Unable to retrieve members");
                }

                allMembers = await response.json();

                displayMembers(allMembers);

            } catch (error) {

                memberList.textContent = "Unable to load members.";

                console.error("Member loading error:", error);
            }
        }

        // Display members on the webpage
        function displayMembers(members) {

            const memberList = document.getElementById("member-list");

            memberList.replaceChildren();

            if (members.length === 0) {

                const message = document.createElement("p");
                message.textContent = "No members found.";

                memberList.appendChild(message);
                return;
            }

            members.forEach(member => {

                // creates member row
                const row = document.createElement("div");
                row.className = "member-row";

                // adds member name
                const name = document.createElement("span");

                name.textContent =
                    member.firstName + " " + member.lastName;

                // adds view Account button
                const link = document.createElement("a");

                link.href =
                    "/member?id=" + encodeURIComponent(member.id);

                link.className = "button-link";
                link.textContent = "View Account";

                row.appendChild(name);
                row.appendChild(link);

                memberList.appendChild(row);

            });
        }

        // enables us to search members by name
        document.getElementById("search-form")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const search = document
                    .getElementById("member-search")
                    .value
                    .trim()
                    .toLowerCase();

                const filteredMembers = allMembers.filter(member => {

                    const fullName =
                        (member.firstName + " " + member.lastName)
                        .toLowerCase();

                    return fullName.includes(search);

                });

                displayMembers(filteredMembers);

            });

        // load
        loadMembers();

    </script>

</body>
</html>
